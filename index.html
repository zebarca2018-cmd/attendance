<!DOCTYPE html>
<html lang="lo">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance & Employee Management</title>
  <style>
    /* -----------------------------------------------------------------
       BASE STYLES & THEME
       ----------------------------------------------------------------- */
    :root {
      --bg-main: #f4f6f9;
      --bg-card: #ffffff;
      --text-main: #2d3748;
      --text-muted: #718096;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --border: #e2e8f0;
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
      
      --c-present: #10b981;
      --c-absent: #ef4444;
      --c-late: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans Lao', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      padding: 20px;
      line-height: 1.5;
    }

    header {
      max-width: 1000px;
      margin: 0 auto 20px auto;
      text-align: center;
    }
    header h1 { color: var(--primary); margin-bottom: 5px; font-size: 24px; }

    /* -----------------------------------------------------------------
       TABS NAVIGATION
       ----------------------------------------------------------------- */
    .tab-nav {
      display: flex;
      gap: 10px;
      max-width: 1000px;
      margin: 0 auto 20px auto;
      border-bottom: 2px solid var(--border);
      padding-bottom: 8px;
    }
    .tab-btn {
      background: none;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      color: var(--text-muted);
      font-weight: 500;
      border-radius: 6px;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .tab-btn:hover { background-color: rgba(79, 70, 229, 0.05); color: var(--primary); }
    .tab-btn.active { background-color: var(--primary); color: white; }

    /* -----------------------------------------------------------------
       COMPONENTS (CARDS, TABLES, FORMS)
       ----------------------------------------------------------------- */
    main { max-width: 1000px; margin: 0 auto; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .card {
      background: var(--bg-card);
      border-radius: 12px;
      padding: 24px;
      box-shadow: var(--shadow);
      margin-bottom: 20px;
      border: 1px solid var(--border);
    }
    .card h3 { margin-bottom: 15px; font-size: 18px; display: flex; align-items: center; gap: 8px; }

    .att-form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }
    label { display: block; margin-bottom: 6px; font-weight: 500; font-size: 14px; }
    select, input {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 15px;
      background-color: #f8fafc;
    }
    select:focus, input:focus { outline: 2px solid var(--primary); background-color: #fff; }

    .btn-save {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
      font-weight: 500;
    }
    .btn-save:hover { background-color: var(--primary-hover); }

    /* Stats Grid */
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }
    .stat-box {
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1px solid var(--border);
    }
    .stat-dot { width: 12px; height: 12px; border-radius: 50%; }
    .stat-dot.present { background-color: var(--c-present); }
    .stat-dot.absent { background-color: var(--c-absent); }
    .stat-dot.late { background-color: var(--c-late); }
    .stat-count { font-size: 20px; font-weight: 700; }
    .stat-label { font-size: 13px; color: var(--text-muted); }

    /* Tables */
    .table-responsive { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 15px; }
    th, td { padding: 12px; border-bottom: 1px solid var(--border); }
    th { background-color: #f8fafc; font-weight: 600; color: var(--text-main); }
    tr:hover { background-color: #f8fafc; }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .badge.Present { background-color: #ecfdf5; color: #065f46; }
    .badge.Absent { background-color: #fef2f2; color: #991b1b; }
    .badge.Late { background-color: #fffbeb; color: #92400e; }

    .muted { color: var(--text-muted); font-size: 14px; }
    .btn-del {
      background-color: #fee2e2;
      color: #ef4444;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-del:hover { background-color: #fca5a5; }

    /* Loading and Toast */
    .loading-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 4px;
      background-color: #e2e8f0;
      display: none;
      z-index: 9999;
    }
    .loading-bar.active { display: block; }
    .loading-bar-inner {
      height: 100%;
      width: 30%;
      background-color: var(--primary);
      animation: loadingAnim 1s infinite linear;
    }
    @keyframes loadingAnim {
      0% { margin-left: -30%; }
      100% { margin-left: 100%; }
    }

    .toast {
      position: fixed;
      bottom: 20px; right: 20px;
      background: #333; color: white;
      padding: 12px 24px;
      border-radius: 8px;
      box-shadow: var(--shadow);
      display: none;
      z-index: 9999;
    }
    .toast.show { display: block; }
    .toast.success { background-color: var(--c-present); }
    .toast.error { background-color: var(--c-absent); }
  </style>
</head>
<body>

  <header>
    <h1>📅 ລະບົບຈັດການລາຍຊື່ ແລະ ເວລາມາວຽກ</h1>
  </header>

  <nav class="tab-nav">
    <button class="tab-btn active" onclick="switchTab(0)">
      <span>📅</span> Attendance Tracking
    </button>
    <button class="tab-btn" onclick="switchTab(1)">
      <span>👥</span> Employee Management
    </button>
  </nav>

  <div class="loading-bar" id="loadingBar"><div class="loading-bar-inner"></div></div>

  <main>
    <div class="tab-panel active" id="tab0">
      <div class="card">
        <h3>📋 ບັນທຶກການມາວຽກ</h3>
        <form id="attendanceForm" onsubmit="event.preventDefault(); saveRecord();">
          <div class="att-form-grid">
            <div>
              <label>ຊື່ພະນັກງານ:</label>
              <select id="empSelect" required>
                <option value="">-- ເລືອກພະນັກງານ --</option>
              </select>
            </div>
            <div>
              <label>ສະຖານະ:</label>
              <select id="statusSelect" required>
                <option value="Present">Present</option>
                <option value="Absent">Absent</option>
                <option value="Late">Late</option>
              </select>
            </div>
          </div>
          <div style="margin-top: 15px;">
            <button class="btn-save" type="submit">+ Save Record</button>
          </div>
        </form>
      </div>

      <div class="stats">
        <div class="stat-box">
          <div class="stat-dot present"></div>
          <div>
            <div class="stat-count" id="countPresent">0</div>
            <div class="stat-label">Present</div>
          </div>
        </div>
        <div class="stat-box">
          <div class="stat-dot absent"></div>
          <div>
            <div class="stat-count" id="countAbsent">0</div>
            <div class="stat-label">Absent</div>
          </div>
        </div>
        <div class="stat-box">
          <div class="stat-dot late"></div>
          <div>
            <div class="stat-count" id="countLate">0</div>
            <div class="stat-label">Late</div>
          </div>
        </div>
      </div>

      <div class="card">
        <h3>📊 ລາຍການມາວຽກທັງໝົດ</h3>
        <div class="table-responsive">
          <table>
            <thead>
              <tr>
                <th>ລໍາດັບ</th>
                <th>ຊື່ພະນັກງານ</th>
                <th>ວັນທີ</th>
                <th>ສະຖານະ</th>
                <th>ເວລາ</th>
                <th>ຈັດການ</th>
              </tr>
            </thead>
            <tbody id="attendanceBody">
              </tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="tab-panel" id="tab1">
      <div class="card">
        <h3>➕ ເpreິ່ມພະນັກງານໃໝ່</h3>
        <form id="employeeForm" onsubmit="event.preventDefault(); saveEmployee();">
          <div class="att-form-grid">
            <div>
              <label>ລະຫັດພະນັກງານ:</label>
              <input type="text" id="empIdInput" required placeholder="ຕົວຢ່າງ: EMP01">
            </div>
            <div>
              <label>ຊື່ ແລະ ນາມສະກຸນ:</label>
              <input type="text" id="empNameInput" required placeholder="ຊື່ພະນັກງານ">
            </div>
            <div>
              <label>ພະແນກ:</label>
              <input type="text" id="empDeptInput" placeholder="ພະແນກ">
            </div>
          </div>
          <div style="margin-top: 15px;">
            <button class="btn-save" type="submit">+ Add Employee</button>
          </div>
        </form>
      </div>

      <div class="card">
        <h3>👥 ລາຍຊື່ພະນັກງານທັງໝົດ</h3>
        <div class="table-responsive">
          <table>
            <thead>
              <tr>
                <th>ລໍາດັບ</th>
                <th>ລະຫັດພະນັກງານ</th>
                <th>ຊື່ ແລະ ນາມສະກຸນ</th>
                <th>ພະແນກ</th>
                <th>ຈັດການ</th>
              </tr>
            </thead>
            <tbody id="employeeBody">
              </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    // -----------------------------------------------------------------
    // CONFIG & GLOBALS
    // -----------------------------------------------------------------
    // ⚠️ ປ່ຽນ URL ດ້ານລຸ່ມນີ້ໃຫ້ເປັນ Web App URL ຂອງເຈົ້າຄືເກົ່າເດີ້
    const API = "https://script.google.com/macros/s/AKfycby3V9NfZ-5C04uNqJ6mBvK6z7fK8b_6m1B9-O6z_yLw/exec"; 
    
    let employees = [];
    let records = [];

    // -----------------------------------------------------------------
    // UTILITIES
    // -----------------------------------------------------------------
    function esc(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function setLoading(show) {
      document.getElementById('loadingBar').classList.toggle('active', show);
    }

    function showToast(msg, type = 'success') {
      const t = document.getElementById('toast');
      if (!t) return;
      t.textContent = msg;
      t.className = `toast show ${type}`;
      setTimeout(() => t.classList.remove('show'), 3000);
    }

    // -----------------------------------------------------------------
    // TAB CONTROLLER
    // -----------------------------------------------------------------
    function switchTab(idx) {
      const buttons = document.querySelectorAll('.tab-btn');
      const panels = document.querySelectorAll('.tab-panel');
      
      buttons.forEach((b, i) => b.classList.toggle('active', i === idx));
      panels.forEach((p, i) => b.classList.toggle('active', i === idx)); // Fixed selection logic
      panels.forEach((p, i) => {
        if (i === idx) {
          p.style.display = 'block';
          p.classList.add('active');
        } else {
          p.style.display = 'none';
          p.classList.remove('active');
        }
      });
    }

    // -----------------------------------------------------------------
    // CORE SYSTEM FUNCTIONS (API & DATA)
    // -----------------------------------------------------------------
    async function fetchData() {
      setLoading(true);
      try {
        const res = await fetch(API);
        const data = await res.json();
        employees = data.employees || [];
        records = data.attendance || [];
      } catch (err) {
        console.error(err);
        showToast('ໂຫຼດຂໍ້ມູນບໍ່ສໍາເລັດ', 'error');
      } finally {
        setLoading(false);
        loadEmpDropdown();
        renderAll();
        renderEmployees();
      }
    }

    async function saveRecord() {
      const empName = document.getElementById('empSelect').value;
      const status = document.getElementById('statusSelect').value;
      if (!empName) return;
      
      setLoading(true);
      try {
        await fetch(API, {
          method: 'POST',
          mode: 'no-cors',
          body: JSON.stringify({ action: 'addAttendance', name: empName, status: status })
        });
        showToast('ບັນທຶກສໍາເລັດ');
        fetchData();
      } catch (err) {
        showToast('ບັນທຶກບໍ່ສໍາເລັດ', 'error');
      } finally {
        setLoading(false);
      }
    }

    async function deleteAttendance(rowIndex) {
      if (!rowIndex || rowIndex === 'undefined') {
        alert('ບໍ່ສາມາດລຶບໄດ້: ບໍ່ພົບຕຳແໜ່ງແຖວຂໍ້ມູນ');
        return;
      }
      if (confirm('ທ່ານແນ່ໃຈບໍ່ວ່າຕ້ອງການລຶບລາຍການມາວຽກນີ້?')) {
        setLoading(true);
        try {
          await fetch(API, {
            method: 'POST',
            mode: 'no-cors',
            body: JSON.stringify({ action: 'deleteAttendance', rowIndex: rowIndex })
          });
          alert('ລຶບຂໍ້ມູນຮຽບຮ້ອຍແລ້ວ!');
          fetchData();
        } catch (error) {
          alert('ເກີດຂໍ້ຜິດພາດໃນການລຶບ');
        } finally {
          setLoading(false);
        }
      }
    }

    async function saveEmployee() {
      const id = document.getElementById('empIdInput').value;
      const name = document.getElementById('empNameInput').value;
      const dept = document.getElementById('empDeptInput').value;
      
      setLoading(true);
      try {
        await fetch(API, {
          method: 'POST',
          mode: 'no-cors',
          body: JSON.stringify({ action: 'addEmployee', id, name, dept })
        });
        showToast('ເພີ່ມພະນັກງານສໍາເລັດ');
        document.getElementById('employeeForm').reset();
        fetchData();
      } catch (err) {
        showToast('ເກີດຂໍ້ຜິດພາດ', 'error');
      } finally {
        setLoading(false);
      }
    }

    async function deleteEmployee(id) {
      if (confirm('ທ່ານແນ່ໃຈບໍ່ວ່າຕ້ອງການລຶບພະນັກງານຜູ້ນີ້?')) {
        setLoading(true);
        try {
          await fetch(API, {
            method: 'POST',
            mode: 'no-cors',
            body: JSON.stringify({ action: 'deleteEmployee', id: id })
          });
          showToast('ລຶບພະນັກງານສໍາເລັດ');
          fetchData();
        } catch (err) {
          showToast('ເກີດຂໍ້ຜິດພາດ', 'error');
        } finally {
          setLoading(false);
        }
      }
    }

    // -----------------------------------------------------------------
    // RENDER INTERFACE LAYER
    // -----------------------------------------------------------------
    function loadEmpDropdown() {
      const select = document.getElementById('empSelect');
      if (!select) return;
      select.innerHTML = '<option value="">-- ເລືອກພະນັກງານ --</option>' + 
        employees.map(e => `<option value="${esc(e.name)}">${esc(e.name)}</option>`).join('');
    }

    function renderAll() {
      const tbody = document.getElementById('attendanceBody');
      if (!tbody) return;

      let present = 0, absent = 0, late = 0;

      if (!records || records.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;">ບໍ່ມີຂໍ້ມູນການມາວຽກ</td></tr>`;
        return;
      }

      tbody.innerHTML = records.map((r, i) => {
        if (r.status === 'Present') present++;
        if (r.status === 'Absent') absent++;
        if (r.status === 'Late') late++;

        let displayDate = '';
        if (r.date) {
          const d = new Date(r.date);
          displayDate = !isNaN(d.getTime()) ? d.toLocaleDateString('lo-LA') : r.date;
        }

        return `
          <tr>
            <td>${records.length - i}</td>
            <td>${esc(r.name)}</td>
            <td>${displayDate}</td>
            <td><span class="badge ${esc(r.status)}">${esc(r.status)}</span></td>
            <td class="muted">${esc(r.time || '')}</td>
            <td><button class="btn-del" onclick="deleteAttendance('${r.rowIndex}')">X</button></td>
          </tr>`;
      }).join('');

      document.getElementById('countPresent').textContent = present;
      document.getElementById('countAbsent').textContent = absent;
      document.getElementById('countLate').textContent = late;
    }

    function renderEmployees() {
      const tbody = document.getElementById('employeeBody');
      if (!tbody) return;
      
      if (!employees || employees.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;">ບໍ່ມີຂໍ້ມູນລາຍຊື່ພະນັກງານ</td></tr>`;
        return;
      }

      tbody.innerHTML = employees.map((emp, i) => `
        <tr>
          <td>${i + 1}</td>
          <td>${esc(emp.id)}</td>
          <td>${esc(emp.name)}</td>
          <td>${esc(emp.dept || '')}</td>
          <td><button class="btn-del" onclick="deleteEmployee('${esc(emp.id)}')">X</button></td>
        </tr>`).join('');
    }

    // ONLOAD INITIALIZATION
    window.onload = fetchData;
  </script>
</body>
</html>
