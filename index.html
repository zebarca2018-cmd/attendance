<!DOCTYPE html>
<html lang="lo">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance Management System</title>
  <style>
    :root {
      --bg-main: #0f172a;
      --bg-card: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --border: #334155;
      --shadow: 0 10px 15px -3px rgba(0,0,0,0.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans Lao', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      padding-bottom: 90px;
    }

    .top-bar {
      display: flex; justify-content: space-between; align-items: center;
      background: #1e293b; padding: 15px 20px; border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 100;
    }
    .top-bar h1 { font-size: 16px; color: var(--primary); font-weight: 600; }
    
    .lang-switcher { display: flex; gap: 6px; }
    .lang-btn {
      background: #334155; border: 1px solid var(--border); color: var(--text-main);
      padding: 6px 12px; border-radius: 20px; cursor: pointer; font-size: 13px;
    }
    .lang-btn.active { background-color: var(--primary); border-color: var(--primary); }

    main { max-width: 800px; margin: 20px auto; padding: 0 15px; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .card {
      background: var(--bg-card); border-radius: 16px; padding: 24px;
      box-shadow: var(--shadow); margin-bottom: 20px; border: 1px solid var(--border);
    }
    .card h3 { margin-bottom: 20px; font-size: 16px; font-weight: 600; color: var(--primary); }

    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px; }
    .form-group { display: flex; flex-direction: column; }
    label { margin-bottom: 8px; font-size: 14px; color: var(--text-muted); }
    
    select, input {
      width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 10px;
      font-size: 14px; background-color: #0f172a; color: var(--text-main); font-family: inherit;
    }

    .btn-submit {
      background-color: var(--primary); color: white; border: none; padding: 14px 24px;
      border-radius: 10px; font-size: 14px; cursor: pointer; font-weight: 600; width: 100%; margin-top: 20px;
    }

    /* 📊 DASHBOARD TABLE */
    .table-responsive { overflow-x: auto; margin-top: 15px; }
    .summary-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
    .summary-table th, .summary-table td { padding: 12px; border-bottom: 1px solid var(--border); }
    .summary-table th { background-color: #0f172a; color: var(--text-muted); }

    /* 👥 GROUPED ATTENDANCE STYLES */
    .emp-group-card { background: var(--bg-card); border-radius: 16px; border: 1px solid var(--border); margin-bottom: 20px; overflow: hidden; }
    .emp-group-header { background: #1e293b; padding: 15px; display: flex; align-items: center; gap: 15px; border-bottom: 1px solid var(--border); }
    .group-img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary); }
    .group-info h4 { font-size: 15px; color: var(--text-main); }
    .group-info p { font-size: 12px; color: var(--text-muted); }
    
    .att-sub-item {
      padding: 12px 15px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; font-size: 13px;
    }
    .att-sub-item:last-child { border-bottom: none; }
    
    .badge { padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; }
    .badge.Present { background: rgba(16, 185, 129, 0.2); color: #34d399; }
    .badge.Absent { background: rgba(239, 68, 68, 0.2); color: #f87171; }
    .badge.Late { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }

    .btn-del-icon { background: none; border: none; color: #f87171; cursor: pointer; font-size: 14px; }

    .employee-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
    .profile-card { background: var(--bg-card); border-radius: 14px; padding: 16px; border: 1px solid var(--border); display: flex; align-items: center; gap: 15px; position: relative; }
    .profile-img-circle { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary); }

    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 70px; background: #1e293b; border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; z-index: 1000; }
    .nav-item { background: none; border: none; flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 4px; color: var(--text-muted); cursor: pointer; font-size: 12px; }
    .nav-item span { font-size: 20px; }
    .nav-item.active { color: var(--primary); font-weight: 600; }

    .loading-bar { position: fixed; top: 0; left: 0; right: 0; height: 3px; background-color: #334155; display: none; z-index: 9999; }
    .loading-bar.active { display: block; }
    .loading-bar-inner { height: 100%; width: 30%; background-color: var(--primary); animation: loadingAnim 1s infinite linear; }
    @keyframes loadingAnim { 0% { margin-left: -30%; } 100% { margin-left: 100%; } }
  </style>
</head>
<body>

  <div class="top-bar">
    <h1 id="ui-app-title">📅 ລະບົບຈັດການລາຍຊື່ ແລະ ເວລາມາວຽກ</h1>
    <div class="lang-switcher">
      <button class="lang-btn active" onclick="changeLang('lo')">🇱🇦 LAO</button>
      <button class="lang-btn" onclick="changeLang('en')">🇬🇧 ENG</button>
    </div>
  </div>

  <div class="loading-bar" id="loadingBar"><div class="loading-bar-inner"></div></div>

  <main>
    <div class="tab-panel active" id="tab0">
      
      <div class="card">
        <h3 id="ui-title-summary">📊 ສະຫຼຸບວັນເຮັດວຽກພະນັກງານ (Summary Dashboard)</h3>
        <div class="table-responsive">
          <table class="summary-table">
            <thead>
              <tr>
                <th id="th-name">ຊື່ພະນັກງານ</th>
                <th id="th-present">ມາ (Present)</th>
                <th id="th-absent">າດ (Absent)</th>
                <th id="th-late">ສາຍ (Late)</th>
              </tr>
            </thead>
            <tbody id="dashboardSummaryBody"></tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <h3 id="ui-title-add-att">📋 ບັນທຶກການມາວຽກມື້ຕໍ່ມື້</h3>
        <form id="attendanceForm" onsubmit="event.preventDefault(); saveRecord();">
          <div class="form-grid">
            <div class="form-group">
              <label id="ui-label-select-emp">ເລືອກພະນັກງານ:</label>
              <select id="empSelect" required><option value="">-- ເມນູເລືອກ --</option></select>
            </div>
            <div class="form-group">
              <label id="ui-label-date">ວັນທີ:</label>
              <input type="date" id="dateInput" required>
            </div>
            <div class="form-group">
              <label id="ui-label-time">ເວລາເຮັດວຽກ:</label>
              <select id="timeSelect" required>
                <option value="08:00 - 17:30">08:00 - 17:30 (Normal Shift)</option>
                <option value="08:30 - 17:00">08:30 - 17:00</option>
                <option value="13:00 - 21:00">13:00 - 21:00 (Evening Shift)</option>
              </select>
            </div>
            <div class="form-group">
              <label id="ui-label-status">ສະຖານະ:</label>
              <select id="statusSelect" required>
                <option value="Present" id="opt-present">Present (ມາ)</option>
                <option value="Absent" id="opt-absent">Absent (ຂາດ)</option>
                <option value="Late" id="opt-late">Late (ສາຍ)</option>
              </select>
            </div>
            <div class="form-group" style="grid-column: 1 / -1;">
              <label id="ui-label-remarks">ໝາຍເຫດ:</label>
              <input type="text" id="remarksInput" placeholder="...">
            </div>
          </div>
          <button class="btn-submit" type="submit" id="ui-btn-save-att">+ ບັນທຶກເວລາມາວຽກ</button>
        </form>
      </div>

      <div style="margin-bottom: 15px;">
        <input type="text" id="searchInput" oninput="renderAttendance()" placeholder="🔍 ຄົ້ນຫາຊື່ພະນັກງານ..." style="background:#1e293b; border:1px solid var(--border);">
      </div>
      
      <div id="attendanceHistoryContainer"></div>
    </div>

    <div class="tab-panel" id="tab1">
      <div class="card">
        <h3 id="ui-title-add-emp">➕ ເພີ່ມພະນັກງານໃໝ່</h3>
        <form id="employeeForm" onsubmit="event.preventDefault(); saveEmployee();">
          <div class="form-grid">
            <div class="form-group"><label id="ui-emp-id">ລະຫັດພະນັກງານ:</label><input type="text" id="empId" required></div>
            <div class="form-group"><label id="ui-emp-name">ຊື່ ແລະ ນາມສະກຸນ:</label><input type="text" id="empName" required></div>
            <div class="form-group"><label id="ui-emp-phone">ເບີໂທ:</label><input type="text" id="empPhone" required></div>
            <div class="form-group"><label id="ui-emp-village">ບ້ານ:</label><input type="text" id="empVillage"></div>
            <div class="form-group"><label id="ui-emp-district">ເມືອງ:</label><input type="text" id="empDistrict"></div>
            <div class="form-group"><label id="ui-emp-province">ແຂວງ:</label><input type="text" id="empProvince"></div>
            <div class="form-group"><label id="ui-emp-dept">ພະແນກ:</label><input type="text" id="empDept"></div>
            <div class="form-group"><label id="ui-emp-pos">ຕຳແໜ່ງ:</label><input type="text" id="empPos"></div>
            <div class="form-group" style="grid-column: 1 / -1;"><label id="ui-emp-img">ຮູບໂປຣໄຟລ໌:</label><input type="file" id="empImageFile" accept="image/*"></div>
          </div>
          <button class="btn-submit" type="submit" id="ui-btn-save-emp">+ ເພີ່ມພະນັກງານ</button>
        </form>
      </div>
      <div class="employee-grid" id="employeeListContainer"></div>
    </div>
  </main>

  <nav class="bottom-nav">
    <button class="nav-item active" id="nav-tab0" onclick="switchTab(0)"><span>📅</span><p id="ui-nav-att">ບັນທຶກວຽກ</p></button>
    <button class="nav-item" id="nav-tab1" onclick="switchTab(1)"><span>👥</span><p id="ui-nav-emp">ພະນັກງານ</p></button>
  </nav>

  <script>
    const API = "https://script.google.com/macros/s/AKfycbwkgZI1JqULFpxl5oGN1-hnVH_sLqL70pS_vma_0enW9W02Ubgg1W3OYGKtZiC5R27esw/exec";
    
    const langData = {
      lo: {
        appTitle: "📅 ລະບົບຈັດການລາຍຊື່ ແລະ ເວລາມາວຽກ", navAtt: "ບັນທຶກວຽກ", navEmp: "ພະນັກງານ",
        titleSummary: "📊 ສະຫຼຸບວັນເຮັດວຽກພະນັກງານ (Dashboard)", thName: "ຊື່ພະນັກງານ", thPresent: "ມາ (Present)", thAbsent: "ຂາດ (Absent)", thLate: "ສາຍ (Late)",
        titleAddAtt: "📋 ບັນທຶກການມາວຽກມື້ຕໍ່ມື້", labelSelectEmp: "ເລືອກພະນັກງານ:", labelDate: "ວັນທີ:", labelStatus: "ສະຖານະ:", labelRemarks: "ໝາຍເຫດ:", labelTime: "ເວລາເຮັດວຽກ:",
        btnSaveAtt: "+ ບັນທຶກເວລາມາວຽກ", searchPlace: "🔍 ຄົ້ນຫາຊື່ພະນັກງານ...", titleAddEmp: "➕ ເພີ່ມພະນັກງານໃໝ່",
        empId: "ລະຫັດພະນັກງານ:", empName: "ຊື່ ແລະ ນາມສະກຸນ:", empPhone: "ເບີໂທ:", empVillage: "ບ້ານ:", empDistrict: "ເມືອງ:", empProvince: "ແຂວງ:",
        empDept: "ພະແນກ:", empPos: "ຕຳແໜ່ງ:", empImg: "ຮູບໂປຣໄຟລ໌:", btnSaveEmp: "+ ເພີ່ມພະນັກງານ",
        optPresent: "Present (ມາ)", optAbsent: "Absent (ຂາດ)", optLate: "Late (ສາຍ)", statusPresent: "ມາ", statusAbsent: "ຂາດ", statusLate: "ສາຍ",
        confirmDel: "ທ່ານແນ່ໃຈບໍ່ວ່າຕ້ອງການລຶບ?", alertSuccess: "ດໍາເນີນການສໍາເລັດ!"
      },
      en: {
        appTitle: "📅 Attendance & Employee Management", navAtt: "Attendance", navEmp: "Employees",
        titleSummary: "📊 Employee Attendance Summary (Dashboard)", thName: "Employee Name", thPresent: "Present", thAbsent: "Absent", thLate: "Late",
        titleAddAtt: "📋 Daily Attendance Tracking", labelSelectEmp: "Select Employee:", labelDate: "Date:", labelStatus: "Status:", labelRemarks: "Remarks:", labelTime: "Work Shift:",
        btnSaveAtt: "+ Save Record", searchPlace: "🔍 Search employee name...", titleAddEmp: "➕ Add New Employee",
        empId: "Employee ID:", empName: "Full Name:", empPhone: "Phone Number:", empVillage: "Village:", empDistrict: "District:", empProvince: "Province:",
        empDept: "Department:", empPos: "Position:", empImg: "Profile Image:", btnSaveEmp: "+ Add Employee",
        optPresent: "Present", optAbsent: "Absent", optLate: "Late", statusPresent: "Present", statusAbsent: "Absent", statusLate: "Late",
        confirmDel: "Are you sure you want to delete this?", alertSuccess: "Success!"
      }
    };

    let currentLang = 'lo'; let employees = []; let attendance = [];
    const fallbackImg = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='50' height='50' viewBox='0 0 24 24'><path fill='%2364748b' d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5-4-8-4z'/></svg>";

    function changeLang(lang) {
      currentLang = lang;
      document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.toggle('active', btn.getAttribute('onclick').includes(lang)));
      updateUI();
    }

    function updateUI() {
      const l = langData[currentLang];
      document.getElementById('ui-app-title').textContent = l.appTitle;
      document.getElementById('ui-nav-att').textContent = l.navAtt;
      document.getElementById('ui-nav-emp').textContent = l.navEmp;
      document.getElementById('ui-title-summary').textContent = l.titleSummary;
      document.getElementById('th-name').textContent = l.thName;
      document.getElementById('th-present').textContent = l.thPresent;
      document.getElementById('th-absent').textContent = l.thAbsent;
      document.getElementById('th-late').textContent = l.thLate;
      document.getElementById('ui-title-add-att').textContent = l.titleAddAtt;
      document.getElementById('ui-label-select-emp').textContent = l.labelSelectEmp;
      document.getElementById('ui-label-date').textContent = l.labelDate;
      document.getElementById('ui-label-status').textContent = l.labelStatus;
      document.getElementById('ui-label-time').textContent = l.labelTime;
      document.getElementById('ui-label-remarks').textContent = l.labelRemarks;
      document.getElementById('ui-btn-save-att').textContent = l.btnSaveAtt;
      document.getElementById('searchInput').placeholder = l.searchPlace;
      document.getElementById('ui-title-add-emp').textContent = l.titleAddEmp;
      document.getElementById('ui-emp-id').textContent = l.empId;
      document.getElementById('ui-emp-name').textContent = l.empName;
      document.getElementById('ui-emp-phone').textContent = l.empPhone;
      document.getElementById('ui-btn-save-emp').textContent = l.btnSaveEmp;
      document.getElementById('opt-present').textContent = l.optPresent;
      document.getElementById('opt-absent').textContent = l.optAbsent;
      document.getElementById('opt-late').textContent = l.optLate;
      renderAttendance(); renderEmployees();
    }

    function switchTab(idx) {
      document.querySelectorAll('.nav-item').forEach((b, i) => b.classList.toggle('active', i === idx));
      document.querySelectorAll('.tab-panel').forEach((p, i) => p.classList.toggle('active', i === idx));
    }

    function setLoading(show) { document.getElementById('loadingBar').classList.toggle('active', show); }
    function esc(str) { return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

    async function fetchData() {
      setLoading(true);
      try {
        const res = await fetch(API); const data = await res.json();
        
        employees = (data.employees || []).map(e => ({
          employeeid: e.employeeid || e.id,
          fullname: e.fullname || e.name,
          phonenumber: e.phonenumber || e.phone,
          village: e.village, district: e.district, province: e.province,
          department: e.department || e.dept, position: e.position || e.pos,
          profileimage: e.profileimage || e.image
        }));

        attendance = (data.attendance || []).map(a => ({
          rowIndex: a.rowIndex || a.rowindex,
          employeeid: a.employeeid || a.id,
          fullname: a.fullname || a.name,
          date: a.date, status: a.status, remarks: a.remarks || a.remark, time: a.time
        }));
        
        // ຕັ້ງຄ່າວັນທີປະຈຸບັນໃຫ້ກົງກັບທ້ອງຖິ່ນ (Local Time)
        const local = new Date();
        const offset = local.getTimezoneOffset();
        const localDate = new Date(local.getTime() - (offset * 60 * 1000));
        document.getElementById('dateInput').value = localDate.toISOString().split('T')[0];
        
        loadEmpDropdown(); buildDashboardSummary(); renderAttendance(); renderEmployees();
      } catch (err) { console.error(err); } finally { setLoading(false); }
    }

    function loadEmpDropdown() {
      const select = document.getElementById('empSelect'); if (!select) return;
      select.innerHTML = '<option value="">-- ເລືອກພະນັກງານ --</option>' + 
        employees.map(e => `<option value="${esc(e.employeeid)}|${esc(e.fullname)}">${esc(e.fullname)} (${esc(e.employeeid)})</option>`).join('');
    }

    function buildDashboardSummary() {
      const body = document.getElementById('dashboardSummaryBody'); if (!body) return;
      let summaryMap = {};
      
      employees.forEach(e => { summaryMap[e.employeeid] = { name: e.fullname, p: 0, a: 0, l: 0 }; });
      attendance.forEach(a => {
        if (summaryMap[a.employeeid]) {
          if (a.status === 'Present') summaryMap[a.employeeid].p++;
          if (a.status === 'Absent') summaryMap[a.employeeid].a++;
          if (a.status === 'Late') summaryMap[a.employeeid].l++;
        }
      });

      let html = '';
      for (let id in summaryMap) {
        let emp = summaryMap[id];
        html += `<tr>
          <td><strong>${esc(emp.name)}</strong> <span style="color:var(--text-muted); font-size:11px;">(${esc(id)})</span></td>
          <td style="color:#34d399; font-weight:bold;">${emp.p} ມື້</td>
          <td style="color:#f87171; font-weight:bold;">${emp.a} ມື້</td>
          <td style="color:#fbbf24; font-weight:bold;">${emp.l} ມື້</td>
        </tr>`;
      }
      body.innerHTML = html || '<tr><td colspan="4" style="text-align:center; color:gray;">No data</td></tr>';
    }

    // 👥 ຟັງຊັນຈັດກຸ່ມປະຫວັດການມາວຽກແຍກເປັນລາຍບຸກຄົນ ແລະ ໄລ່ລຽງວັນທີ
    function renderAttendance() {
      const container = document.getElementById('attendanceHistoryContainer'); if (!container) return;
      const query = document.getElementById('searchInput').value.toLowerCase(); const l = langData[currentLang];
      
      // 1. ກັ່ນຕອງຕາມຄຳຄົ້ນຫາ
      const filtered = attendance.filter(r => (r.fullname || '').toLowerCase().includes(query));
      if (filtered.length === 0) { container.innerHTML = `<p style="text-align:center; color:gray; padding:20px;">No data found</p>`; return; }

      // 2. ຈັດກຸ່ມຂໍ້ມູນຕາມ Employee ID
      let groups = {};
      filtered.forEach(rec => {
        if (!groups[rec.employeeid]) {
          // ຊອກຫາຮູບໂປຣໄຟລ໌ຈາກລາຍຊື່ພະນັກງານ
          const empObj = employees.find(e => e.employeeid === rec.employeeid);
          groups[rec.employeeid] = {
            id: rec.employeeid,
            name: rec.fullname,
            img: (empObj && empObj.profileimage) ? empObj.profileimage : fallbackImg,
            records: []
          };
        }
        groups[rec.employeeid].records.push(rec);
      });

      // 3. ສະແດງຜົນແຍກແຕ່ລະຄົນ ແລະ ລຽງລໍາດັບວັນທີ (ເກົ່າໄປໃໝ່ ຕັ້ງແຕ່ຕົ້ນເດືອນ)
      let html = '';
      for (let empId in groups) {
        let group = groups[empId];
        
        // ລຽງວັນທີຈາກນ້ອຍໄປຫາຫຼາຍ
        group.records.sort((a, b) => new Date(a.date) - new Date(b.date));

        html += `
          <div class="emp-group-card">
            <div class="emp-group-header">
              <img class="group-img" src="${group.img}">
              <div class="group-info">
                <h4>${esc(group.name)}</h4>
                <p>🆔 ID: ${esc(group.id)}</p>
              </div>
            </div>
            <div class="group-records-list">
              ${group.records.map(r => {
                let displayStatus = r.status === 'Present' ? l.statusPresent : (r.status === 'Absent' ? l.statusAbsent : l.statusLate);
                return `
                  <div class="att-sub-item">
                    <div>
                      <strong>📅 ${esc(r.date)}</strong> | ⏰ ${esc(r.time || '08:00 - 17:30')}
                      ${r.remarks ? `<br><span style="color:var(--primary); font-size:12px;">📝 ${esc(r.remarks)}</span>` : ''}
                    </div>
                    <div style="display:flex; align-items:center; gap:12px;">
                      <span class="badge ${esc(r.status)}">${esc(displayStatus)}</span>
                      <button class="btn-del-icon" onclick="deleteAttendance('${r.rowIndex}')">🗑️</button>
                    </div>
                  </div>`;
              }).join('')}
            </div>
          </div>`;
      }
      container.innerHTML = html;
    }

    async function saveRecord() {
      const selectVal = document.getElementById('empSelect').value; if (!selectVal) return;
      const [id, name] = selectVal.split('|');
      const date = document.getElementById('dateInput').value;
      const status = document.getElementById('statusSelect').value;
      const time = document.getElementById('timeSelect').value;
      const remarks = document.getElementById('remarksInput').value;

      setLoading(true);
      try {
        await fetch(API, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'addAttendance', id, name, date, status, time, remarks }) });
        alert(langData[currentLang].alertSuccess); document.getElementById('remarksInput').value = ""; fetchData();
      } catch (err) { console.error(err); } finally { setLoading(false); }
    }

    async function deleteAttendance(rowIndex) {
      if (confirm(langData[currentLang].confirmDel)) {
        setLoading(true);
        try {
          await fetch(API, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'deleteAttendance', rowIndex: rowIndex }) });
          fetchData();
        } catch (err) { console.error(err); } finally { setLoading(false); }
      }
    }

    function getBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader(); reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result); reader.onerror = error => reject(error);
      });
    }

    async function saveEmployee() {
      const id = document.getElementById('empId').value; const name = document.getElementById('empName').value;
      const phone = document.getElementById('empPhone').value; const village = document.getElementById('empVillage').value;
      const district = document.getElementById('empDistrict').value; const province = document.getElementById('empProvince').value;
      const department = document.getElementById('empDept').value; const position = document.getElementById('empPos').value;
      const imgFile = document.getElementById('empImageFile').files[0];
      
      let base64Img = ""; if (imgFile) { base64Img = await getBase64(imgFile); }

      setLoading(true);
      try {
        await fetch(API, {
          method: 'POST', mode: 'no-cors',
          body: JSON.stringify({ action: 'addEmployee', id, name, phone, village, district, province, department, position, image: base64Img })
        });
        alert(langData[currentLang].alertSuccess); document.getElementById('employeeForm').reset(); fetchData();
      } catch (err) { console.error(err); } finally { setLoading(false); }
    }

    async function deleteEmployee(id) {
      if (confirm(langData[currentLang].confirmDel)) {
        setLoading(true);
        try {
          await fetch(API, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'deleteEmployee', id: id }) });
          fetchData();
        } catch (err) { console.error(err); } finally { setLoading(false); }
      }
    }

    function renderEmployees() {
      const container = document.getElementById('employeeListContainer'); if (!container) return;
      if (employees.length === 0) { container.innerHTML = `<p style="text-align:center; color:gray; padding:20px; grid-column:1/-1;">No employees</p>`; return; }

      container.innerHTML = employees.map(emp => {
        return `
          <div class="profile-card">
            <img class="profile-img-circle" src="${emp.profileimage || fallbackImg}" alt="Profile">
            <div class="profile-info">
              <h4>${esc(emp.fullname)}</h4>
              <p>🆔 ID: ${esc(emp.employeeid)}</p>
              <p>📞 Phone: ${esc(emp.phonenumber)}</p>
              <p>🏢 ${esc(emp.department || '-')} | 💼 ${esc(emp.position || '-')}</p>
            </div>
            <button class="btn-del-icon" style="position:absolute; top:10px; right:10px;" onclick="deleteEmployee('${esc(emp.employeeid)}')">🗑️</button>
          </div>`;
      }).join('');
    }

    window.onload = fetchData;
  </script>
</body>
</html>
