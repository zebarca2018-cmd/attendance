<!DOCTYPE html>
<html lang="lo">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance & Employee Management</title>
  <style>
    /* -----------------------------------------------------------------
       DARK THEME STYLES (ປັບໃຫ້ງາມຄືຮູບທີ 2)
       ----------------------------------------------------------------- */
    :root {
      --bg-main: #0f172a;        /* ສີພື້ນຫຼັງມືດ */
      --bg-card: #1e293b;        /* ສີກາດ */
      --text-main: #f8fafc;      /* ສີໜັງສືຫຼັກ */
      --text-muted: #94a3b8;     /* ສີໜັງສືຈາງ */
      --primary: #3b82f6;        /* ສີຫຼັກ (ປ່ຽນໄດ້ຈາກ Color Picker) */
      --primary-hover: #2563eb;
      --border: #334155;
      --shadow: 0 10px 15px -3px rgba(0,0,0,0.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans Lao', 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      padding-bottom: 90px;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1e293b;
      padding: 15px 20px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .top-bar h1 { font-size: 18px; color: var(--primary); font-weight: 600; }
    
    .controls-right { display: flex; align-items: center; gap: 12px; }
    
    /* Color Picker Style */
    .color-picker-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .color-picker-wrapper input[type="color"] {
      -webkit-appearance: none;
      border: none;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      cursor: pointer;
      background: none;
    }
    .color-picker-wrapper input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    .color-picker-wrapper input[type="color"]::-webkit-color-swatch { border: 2px solid #fff; border-radius: 50%; }

    .lang-switcher { display: flex; gap: 6px; }
    .lang-btn {
      background: #334155;
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s;
    }
    .lang-btn.active {
      background-color: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    /* Main Container */
    main { max-width: 800px; margin: 20px auto; padding: 0 15px; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* Cards & Forms */
    .card {
      background: var(--bg-card);
      border-radius: 16px;
      padding: 24px;
      box-shadow: var(--shadow);
      margin-bottom: 20px;
      border: 1px solid var(--border);
    }
    .card h3 { margin-bottom: 20px; font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; color: var(--primary); }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
    }
    .form-group { display: flex; flex-direction: column; }
    label { margin-bottom: 8px; font-weight: 500; font-size: 14px; color: var(--text-muted); }
    
    select, input, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      background-color: #0f172a;
      color: var(--text-main);
      font-family: inherit;
      transition: all 0.2s;
    }
    select:focus, input:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); }

    .btn-submit {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 14px 24px;
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 600;
      width: 100%;
      margin-top: 20px;
      transition: background 0.2s;
    }
    .btn-submit:hover { background-color: var(--primary-hover); }

    /* Dashboard Status Counters (ຄືຮູບທີ 2) */
    .dashboard-counters {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }
    .counter-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      box-shadow: var(--shadow);
    }
    .counter-box h2 { font-size: 24px; margin-bottom: 4px; }
    .counter-box p { font-size: 12px; color: var(--text-muted); display: flex; align-items: center; justify-content: center; gap: 6px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

    /* Lists & Items */
    .search-box { margin-bottom: 15px; }
    .att-item {
      background: var(--bg-card);
      border-radius: 12px;
      padding: 16px;
      border: 1px solid var(--border);
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow);
    }
    .att-details h4 { font-size: 15px; margin-bottom: 4px; font-weight: 600; }
    .att-details p { font-size: 13px; color: var(--text-muted); }
    
    .badge {
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    .badge.Present { background-color: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4); }
    .badge.Absent { background-color: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); }
    .badge.Late { background-color: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.4); }

    /* Employee Profiles */
    .employee-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 15px;
    }
    .profile-card {
      background: var(--bg-card);
      border-radius: 14px;
      padding: 16px;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 15px;
      position: relative;
      box-shadow: var(--shadow);
    }
    .profile-img-circle {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      object-fit: cover;
      background: #334155;
      border: 2px solid var(--primary);
    }
    .profile-info { flex: 1; }
    .profile-info h4 { font-size: 15px; margin-bottom: 6px; font-weight: 600; }
    .profile-info p { font-size: 12px; color: var(--text-muted); margin-bottom: 3px; }

    .btn-del-icon {
      background: none;
      border: none;
      color: #f87171;
      cursor: pointer;
      font-size: 16px;
      padding: 5px;
      transition: transform 0.2s;
    }
    .btn-del-icon:hover { transform: scale(1.1); }

    /* 📱 BOTTOM NAV BAR */
    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 70px;
      background: #1e293b;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 1000;
      box-shadow: 0 -10px 20px rgba(0,0,0,0.2);
    }
    .nav-item {
      background: none;
      border: none;
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
    }
    .nav-item span { font-size: 22px; }
    .nav-item.active { color: var(--primary); font-weight: 600; }

    /* Loading Bar */
    .loading-bar {
      position: fixed;
      top: 0; left: 0; right: 0; height: 3px;
      background-color: #334155; display: none; z-index: 9999;
    }
    .loading-bar.active { display: block; }
    .loading-bar-inner {
      height: 100%; width: 30%; background-color: var(--primary);
      animation: loadingAnim 1s infinite linear;
    }
    @keyframes loadingAnim { 0% { margin-left: -30%; } 100% { margin-left: 100%; } }
  </style>
</head>
<body>

  <div class="top-bar">
    <h1 id="ui-app-title">📅 ລະບົບຈັດການລາຍຊື່ ແລະ ເວລາມາວຽກ</h1>
    <div class="controls-right">
      <div class="color-picker-wrapper">
        <input type="color" id="themePicker" value="#3b82f6" oninput="changeTheme(this.value)">
      </div>
      <div class="lang-switcher">
        <button class="lang-btn active" onclick="changeLang('lo')">🇱🇦 ລາວ</button>
        <button class="lang-btn" onclick="changeLang('en')">🇬🇧 ENG</button>
      </div>
    </div>
  </div>

  <div class="loading-bar" id="loadingBar"><div class="loading-bar-inner"></div></div>

  <main>
    <div class="tab-panel active" id="tab0">
      
      <div class="dashboard-counters">
        <div class="counter-box">
          <h2 id="count-present">0</h2>
          <p><span class="dot" style="background:#10b981;"></span><span id="ui-c-present">Present</span></p>
        </div>
        <div class="counter-box">
          <h2 id="count-absent">0</h2>
          <p><span class="dot" style="background:#ef4444;"></span><span id="ui-c-absent">Absent</span></p>
        </div>
        <div class="counter-box">
          <h2 id="count-late">0</h2>
          <p><span class="dot" style="background:#f59e0b;"></span><span id="ui-c-late">Late</span></p>
        </div>
      </div>

      <div class="card">
        <h3 id="ui-title-add-att">📋 ບັນທຶກການມາວຽກມື້ຕໍ່ມື້</h3>
        <form id="attendanceForm" onsubmit="event.preventDefault(); saveRecord();">
          <div class="form-grid">
            <div class="form-group">
              <label id="ui-label-select-emp">ເລືອກພະນັກງານ:</label>
              <select id="empSelect" required>
                <option value="">-- ເລືອກພະນັກງານ --</option>
              </select>
            </div>
            <div class="form-group">
              <label id="ui-label-date">ວັນທີ:</label>
              <input type="date" id="dateInput" required>
            </div>
            <div class="form-group">
              <label id="ui-label-status">ສະຖານະ:</label>
              <select id="statusSelect" required>
                <option value="Present" id="opt-present">Present (ມາ)</option>
                <option value="Absent" id="opt-absent">Absent (ຂາດ)</option>
                <option value="Late" id="opt-late">Late (ສາຍ)</option>
              </select>
            </div>
            <div class="form-group" style="grid-column: 1 / -1;">
              <label id="ui-label-remarks">ໝາຍເຫດ:</label>
              <input type="text" id="remarksInput" placeholder="...">
            </div>
          </div>
          <button class="btn-submit" type="submit" id="ui-btn-save-att">+ ບັນທຶກເວລາມາວຽກ</button>
        </form>
      </div>

      <div class="search-box">
        <input type="text" id="searchInput" oninput="renderAttendance()" placeholder="🔍 ຄົ້ນຫາຊື່ພະນັກງານ...">
      </div>
      <div id="attendanceHistoryContainer"></div>
    </div>

    <div class="tab-panel" id="tab1">
      <div class="card">
        <h3 id="ui-title-add-emp">➕ ເພີ່ມພະນັກງານໃໝ່</h3>
        <form id="employeeForm" onsubmit="event.preventDefault(); saveEmployee();">
          <div class="form-grid">
            <div class="form-group">
              <label id="ui-emp-id">ລະຫັດພະນັກງານ:</label>
              <input type="text" id="empId" required placeholder="EMP01">
            </div>
            <div class="form-group">
              <label id="ui-emp-name">ຊື່ ແລະ ນາມສະກຸນ:</label>
              <input type="text" id="empName" required placeholder="...">
            </div>
            <div class="form-group">
              <label id="ui-emp-phone">ເບີໂທ:</label>
              <input type="text" id="empPhone" required placeholder="020...">
            </div>
            <div class="form-group">
              <label id="ui-emp-village">ບ້ານ:</label>
              <input type="text" id="empVillage" placeholder="...">
            </div>
            <div class="form-group">
              <label id="ui-emp-district">ເມືອງ:</label>
              <input type="text" id="empDistrict" placeholder="...">
            </div>
            <div class="form-group">
              <label id="ui-emp-province">ແຂວງ:</label>
              <input type="text" id="empProvince" placeholder="...">
            </div>
            <div class="form-group">
              <label id="ui-emp-dept">ພະແນກ:</label>
              <input type="text" id="empDept" placeholder="...">
            </div>
            <div class="form-group">
              <label id="ui-emp-pos">ຕຳແໜ່ງ:</label>
              <input type="text" id="empPos" placeholder="...">
            </div>
            <div class="form-group" style="grid-column: 1 / -1;">
              <label id="ui-emp-img">ຮູບໂປຣໄຟລ໌:</label>
              <input type="file" id="empImageFile" accept="image/*">
            </div>
          </div>
          <button class="btn-submit" type="submit" id="ui-btn-save-emp">+ ເພີ່ມພະນັກງານ</button>
        </form>
      </div>

      <div class="employee-grid" id="employeeListContainer"></div>
    </div>
  </main>

  <nav class="bottom-nav">
    <button class="nav-item active" id="nav-tab0" onclick="switchTab(0)">
      <span>📅</span><p id="ui-nav-att">ບັນທຶກວຽກ</p>
    </button>
    <button class="nav-item" id="nav-tab1" onclick="switchTab(1)">
      <span>👥</span><p id="ui-nav-emp">ພະນັກງານ</p>
    </button>
  </nav>

  <script>
    // -----------------------------------------------------------------
    // CONFIG & DICTIONARY
    // -----------------------------------------------------------------
    const API = "https://script.google.com/macros/s/AKfycbwkgZI1JqULFpxl5oGN1-hnVH_sLqL70pS_vma_0enW9W02Ubgg1W3OYGKtZiC5R27esw/exec";
    
    const langData = {
      lo: {
        appTitle: "📅 ລະບົບຈັດການລາຍຊື່ ແລະ ເວລາມາວຽກ",
        navAtt: "ບັນທຶກວຽກ", navEmp: "ພະນັກງານ",
        titleAddAtt: "📋 ບັນທຶກການມາວຽກມື້ຕໍ່ມື້", labelSelectEmp: "ເລືອກພະນັກງານ:",
        labelDate: "ວັນທີ:", labelStatus: "ສະຖານະ:", labelRemarks: "ໝາຍເຫດ:",
        btnSaveAtt: "+ ບັນທຶກເວລາມາວຽກ", searchPlace: "🔍 ຄົ້ນຫາຊື່ພະນັກງານ...",
        titleAddEmp: "➕ ເພີ່ມພະນັກງານໃໝ່", empId: "ລະຫັດພະນັກງານ:",
        empName: "ຊື່ ແລະ ນາມສະກຸນ:", empPhone: "ເບີໂທ:", empVillage: "ບ້ານ:",
        empDistrict: "ເມືອງ:", empProvince: "ແຂວງ:", empDept: "ພະແນກ:",
        empPos: "ຕຳແໜ່ງ:", empImg: "ຮູບໂປຣໄຟລ໌:", btnSaveEmp: "+ ເພີ່ມພະນັກງານ",
        optPresent: "ມາ (Present)", optAbsent: "ຂາດ (Absent)", optLate: "ສາຍ (Late)",
        statusPresent: "ມາ", statusAbsent: "ຂາດ", statusLate: "ສາຍ",
        confirmDel: "ທ່ານແນ່ໃຈບໍ່ວ່າຕ້ອງການລຶບ?", alertSuccess: "ດໍາເນີນການສໍາເລັດ!"
      },
      en: {
        appTitle: "📅 Attendance & Employee Management",
        navAtt: "Attendance", navEmp: "Employees",
        titleAddAtt: "📋 Daily Attendance Tracking", labelSelectEmp: "Select Employee:",
        labelDate: "Date:", labelStatus: "Status:", labelRemarks: "Remarks:",
        btnSaveAtt: "+ Save Record", searchPlace: "🔍 Search employee name...",
        titleAddEmp: "➕ Add New Employee", empId: "Employee ID:",
        empName: "Full Name:", empPhone: "Phone Number:", empVillage: "Village:",
        empDistrict: "District:", empProvince: "Province:", empDept: "Department:",
        empPos: "Position:", empImg: "Profile Image:", btnSaveEmp: "+ Add Employee",
        optPresent: "Present", optAbsent: "Absent", optLate: "Late",
        statusPresent: "Present", statusAbsent: "Absent", statusLate: "Late",
        confirmDel: "Are you sure you want to delete this?", alertSuccess: "Success!"
      }
    };

    let currentLang = 'lo';
    let employees = [];
    let attendance = [];

    // 🎨 FUNCTION CHANGE THEME COLOR
    function changeTheme(colorVal) {
      document.documentElement.style.setProperty('--primary', colorVal);
      document.documentElement.style.setProperty('--primary-hover', colorVal + 'cc');
    }

    // MULTI-LANGUAGE SYSTEM
    function changeLang(lang) {
      currentLang = lang;
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('onclick').includes(lang));
      });
      updateUI();
    }

    function updateUI() {
      const l = langData[currentLang];
      document.getElementById('ui-app-title').textContent = l.appTitle;
      document.getElementById('ui-nav-att').textContent = l.navAtt;
      document.getElementById('ui-nav-emp').textContent = l.navEmp;
      document.getElementById('ui-title-add-att').textContent = l.titleAddAtt;
      document.getElementById('ui-label-select-emp').textContent = l.labelSelectEmp;
      document.getElementById('ui-label-date').textContent = l.labelDate;
      document.getElementById('ui-label-status').textContent = l.labelStatus;
      document.getElementById('ui-label-remarks').textContent = l.labelRemarks;
      document.getElementById('ui-btn-save-att').textContent = l.btnSaveAtt;
      document.getElementById('searchInput').placeholder = l.searchPlace;
      document.getElementById('ui-title-add-emp').textContent = l.titleAddEmp;
      document.getElementById('ui-emp-id').textContent = l.empId;
      document.getElementById('ui-emp-name').textContent = l.empName;
      document.getElementById('ui-emp-phone').textContent = l.empPhone;
      document.getElementById('ui-emp-village').textContent = l.empVillage;
      document.getElementById('ui-emp-district').textContent = l.empDistrict;
      document.getElementById('ui-emp-province').textContent = l.empProvince;
      document.getElementById('ui-emp-dept').textContent = l.empDept;
      document.getElementById('ui-emp-pos').textContent = l.empPos;
      document.getElementById('ui-emp-img').textContent = l.empImg;
      document.getElementById('ui-btn-save-emp').textContent = l.btnSaveEmp;
      
      document.getElementById('opt-present').textContent = l.optPresent;
      document.getElementById('opt-absent').textContent = l.optAbsent;
      document.getElementById('opt-late').textContent = l.optLate;
      
      document.getElementById('ui-c-present').textContent = l.statusPresent;
      document.getElementById('ui-c-absent').textContent = l.statusAbsent;
      document.getElementById('ui-c-late').textContent = l.statusLate;

      renderAttendance();
      renderEmployees();
    }

    function switchTab(idx) {
      document.querySelectorAll('.nav-item').forEach((b, i) => b.classList.toggle('active', i === idx));
      document.querySelectorAll('.tab-panel').forEach((p, i) => p.classList.toggle('active', i === idx));
    }

    function setLoading(show) {
      document.getElementById('loadingBar').classList.toggle('active', show);
    }

    function esc(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // FETCH DATA & FIX DROPDOWN MAPPING
    async function fetchData() {
      setLoading(true);
      try {
        const res = await fetch(API);
        const data = await res.json();
        
        // 🛠️ ແກ້ໄຂບັກການອ່ານຄ່າຊື່ຫົວຖັນ (ໃຫ້ຮອງຮັບທັງຕົວພິມໃຫຍ່ ແລະ ພິມນ້ອຍ)
        employees = (data.employees || []).map(e => ({
          employeeid: e.employeeid || e.id || e.EmployeeID || '',
          fullname: e.fullname || e.name || e.FullName || '',
          phonenumber: e.phonenumber || e.phone || e.PhoneNumber || '',
          village: e.village || '',
          district: e.district || '',
          province: e.province || '',
          department: e.department || '',
          position: e.position || '',
          profileimage: e.profileimage || e.image || ''
        }));

        attendance = (data.attendance || []).map(a => ({
          rowIndex: a.rowIndex || a.rowindex,
          employeeid: a.employeeid || a.id,
          fullname: a.fullname || a.name,
          date: a.date,
          status: a.status,
          remarks: a.remarks || '',
          time: a.time
        }));
        
        document.getElementById('dateInput').value = new Date().toISOString().split('T')[0];
        
        loadEmpDropdown();
        calculateCounters();
        renderAttendance();
        renderEmployees();
      } catch (err) {
        console.error(err);
      } finally {
        setLoading(false);
      }
    }

    function loadEmpDropdown() {
      const select = document.getElementById('empSelect');
      if (!select) return;
      select.innerHTML = '<option value="">-- ເລືອກພະນັກງານ --</option>' + 
        employees.map(e => `<option value="${esc(e.employeeid)}|${esc(e.fullname)}">${esc(e.fullname)} (${esc(e.employeeid)})</option>`).join('');
    }

    function calculateCounters() {
      let p = 0, a = 0, l = 0;
      attendance.forEach(r => {
        if (r.status === 'Present') p++;
        if (r.status === 'Absent') a++;
        if (r.status === 'Late') l++;
      });
      document.getElementById('count-present').textContent = p;
      document.getElementById('count-absent').textContent = a;
      document.getElementById('count-late').textContent = l;
    }

    function getBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
      });
    }

    async function saveEmployee() {
      const id = document.getElementById('empId').value;
      const name = document.getElementById('empName').value;
      const phone = document.getElementById('empPhone').value;
      const village = document.getElementById('empVillage').value;
      const district = document.getElementById('empDistrict').value;
      const province = document.getElementById('empProvince').value;
      const department = document.getElementById('empDept').value;
      const position = document.getElementById('empPos').value;
      const imgFile = document.getElementById('empImageFile').files[0];
      
      let base64Img = "";
      if (imgFile) { base64Img = await getBase64(imgFile); }

      setLoading(true);
      try {
        await fetch(API, {
          method: 'POST',
          mode: 'no-cors',
          body: JSON.stringify({
            action: 'addEmployee', id, name, phone, village, district, province, department, position, image: base64Img
          })
        });
        alert(langData[currentLang].alertSuccess);
        document.getElementById('employeeForm').reset();
        fetchData();
      } catch (err) { console.error(err); } finally { setLoading(false); }
    }

    async function saveRecord() {
      const selectVal = document.getElementById('empSelect').value;
      if (!selectVal) return;
      const [id, name] = selectVal.split('|');
      const date = document.getElementById('dateInput').value;
      const status = document.getElementById('statusSelect').value;
      const remarks = document.getElementById('remarksInput').value;

      setLoading(true);
      try {
        await fetch(API, {
          method: 'POST',
          mode: 'no-cors',
          body: JSON.stringify({ action: 'addAttendance', id, name, date, status, remarks })
        });
        alert(langData[currentLang].alertSuccess);
        document.getElementById('remarksInput').value = "";
        fetchData();
      } catch (err) { console.error(err); } finally { setLoading(false); }
    }

    async function deleteAttendance(rowIndex) {
      if (confirm(langData[currentLang].confirmDel)) {
        setLoading(true);
        try {
          await fetch(API, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'deleteAttendance', rowIndex: rowIndex }) });
          fetchData();
        } catch (err) { console.error(err); }
      }
    }

    async function deleteEmployee(id) {
      if (confirm(langData[currentLang].confirmDel)) {
        setLoading(true);
        try {
          await fetch(API, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'deleteEmployee', id: id }) });
          fetchData();
        } catch (err) { console.error(err); }
      }
    }

    function renderAttendance() {
      const container = document.getElementById('attendanceHistoryContainer');
      if (!container) return;
      const query = document.getElementById('searchInput').value.toLowerCase();
      const l = langData[currentLang];

      const filtered = attendance.filter(r => (r.fullname || '').toLowerCase().includes(query));

      if (filtered.length === 0) {
        container.innerHTML = `<p style="text-align:center; color:gray; padding:20px;">No data found</p>`;
        return;
      }

      container.innerHTML = filtered.map(r => {
        let displayStatus = r.status;
        if (r.status === 'Present') displayStatus = l.statusPresent;
        if (r.status === 'Absent') displayStatus = l.statusAbsent;
        if (r.status === 'Late') displayStatus = l.statusLate;

        return `
          <div class="att-item">
            <div class="att-details">
              <h4>${esc(r.fullname)} <span style="font-size:12px; color:#94a3b8;">踩(${esc(r.employeeid)})</span></h4>
              <p>📅 ${esc(r.date)} | ⏰ ${esc(r.time || '')}</p>
              ${r.remarks ? `<p style="font-style:italic; color:var(--primary);">📝 ${esc(r.remarks)}</p>` : ''}
            </div>
            <div style="display:flex; align-items:center; gap:10px;">
              <span class="badge ${esc(r.status)}">${esc(displayStatus)}</span>
              <button class="btn-del-icon" onclick="deleteAttendance('${r.rowIndex}')">🗑️</button>
            </div>
          </div>`;
      }).join('');
    }

    function renderEmployees() {
      const container = document.getElementById('employeeListContainer');
      if (!container) return;

      if (employees.length === 0) {
        container.innerHTML = `<p style="text-align:center; color:gray; padding:20px; grid-column:1/-1;">No employees</p>`;
        return;
      }

      container.innerHTML = employees.map(emp => {
        const fallbackImg = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='50' height='50' viewBox='0 0 24 24'><path fill='%2364748b' d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5-4-8-4z'/></svg>";
        const profileSrc = emp.profileimage ? emp.profileimage : fallbackImg;

        return `
          <div class="profile-card">
            <img class="profile-img-circle" src="${profileSrc}" alt="Profile">
            <div class="profile-info">
              <h4>${esc(emp.fullname)}</h4>
              <p>🆔 ID: ${esc(emp.employeeid)}</p>
              <p>📞 Phone: ${esc(emp.phonenumber)}</p>
              <p>🏢 ${esc(emp.department || '-')} | 💼 ${esc(emp.position || '-')}</p>
              <p>📍 ${esc(emp.village || '')} ${esc(emp.district || '')} ${esc(emp.province || '')}</p>
            </div>
            <button class="btn-del-icon" style="position:absolute; top:10px; right:10px;" onclick="deleteEmployee('${esc(emp.employeeid)}')">🗑️</button>
          </div>`;
      }).join('');
    }

    window.onload = fetchData;
  </script>
</body>
</html>
